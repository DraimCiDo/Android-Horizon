name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [samsung-s25-ultra]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check device profile and public tree
        run: |
          python3 tools/check_public_tree.py
          rustc --edition 2024 --test crates/horizon-client/src/android_device.rs -o /tmp/device-profile-test
          /tmp/device-profile-test
      - name: Build APK
        run: bash packaging/android/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-s25-ultra-arm64
          path: target/android/horizon.apk
          if-no-files-found: error
          retention-days: 14

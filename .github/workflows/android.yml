name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional android-* release tag; publish only after APK verification
        type: string
        default: ''
  push:
    tags: ['android-*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: release
      HORIZON_VERSION: 0.4.1-android
      HORIZON_REQUIRE_BUNDLE: '1'
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare complete game resources for the APK
        run: |
          python3 -m tools.android_bundle inputs
          cargo build --locked -p horizon-prepare
          INPUTS="$PWD/.local/android-bundle-inputs"
          target/debug/horizon-prepare --prepare --complete --root "$PWD" \
            --output "$PWD/target/android/prepared" \
            --version-json "$INPUTS/version.json" --client-jar "$INPUTS/client.jar" \
            --server-jar "$INPUTS/server.jar" --libraries-dir "$INPUTS/libraries" \
            --assets-dir "$INPUTS/assets"
          target/debug/horizon-prepare --check --root "$PWD" --output "$PWD/target/android/prepared"
          python3 -m tools.android_bundle pack target/android/prepared target/android/bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check device profile and public tree
        run: |
          python3 tools/check_public_tree.py
          rustc --edition 2024 --test crates/horizon-client/src/android_device.rs -o /tmp/device-profile-test
          /tmp/device-profile-test
      - name: Build APK
        run: bash packaging/android/build_apk.sh
      - name: Verify APK and ELF alignment
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose target/android/horizon.apk
          "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf -lW target/android/stage/lib/arm64-v8a/libhorizon.so > target/android/elf-segments.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          loads = [line.split() for line in Path('target/android/elf-segments.txt').read_text().splitlines() if line.strip().startswith('LOAD ')]
          assert loads and all(int(fields[-1], 16) >= 16384 for fields in loads), 'ELF is not aligned for 16 KiB pages'
          with zipfile.ZipFile('target/android/horizon.apk') as apk:
              entry = apk.getinfo('assets/horizon-resources.zip')
              assert entry.compress_type == zipfile.ZIP_STORED, 'AssetManager.openFd requires an uncompressed asset'
              metadata = json.loads(apk.read('assets/horizon-bundle.json'))
              with apk.open(entry) as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == metadata['sha256']
          PY
          cp target/android/horizon.apk target/android/horizon-0.4.1-s25-ultra-arm64.apk
          cd target/android
          sha256sum horizon-0.4.1-s25-ultra-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-s25-ultra-arm64
          path: |
            target/android/horizon-0.4.1-s25-ultra-arm64.apk
            target/android/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android prerelease
        if: startsWith(github.ref, 'refs/tags/android-') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in android-*) ;; *) echo "Expected an android-* release tag" >&2; exit 1;; esac
          gh release create "$RELEASE_TAG" \
            target/android/horizon-0.4.1-s25-ultra-arm64.apk target/android/SHA256SUMS \
            --title "Horizon Android 0.4.1 — complete APK, portrait setup" \
            --target "$GITHUB_SHA" --notes-file packaging/android/release-notes.md --prerelease
